<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Whimsical Gallery</title>
  <link rel="stylesheet" href="/src/index.css" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background-color: #f8f7f5;
    }

    /* Lightbox styles */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      align-items: center;
      justify-content: center;
      z-index: 50;
      flex-direction: column;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 80%;
      border-radius: 0.75rem;
    }

    #lightbox-caption {
      color: white;
      margin-top: 0.5rem;
      text-align: center;
      font-size: 1rem;
    }

    .lightbox button {
      transition: background 0.2s;
    }
  </style>
</head>

<body class="flex justify-center py-10">

  <!-- Page container -->
  <div class="w-full max-w-6xl bg-white shadow-lg rounded-xl px-6 md:px-10 py-8">

    <!-- Logo -->
    <div class="flex justify-center mb-6">
      <img src="/cakes/Petalandleafbanner.png" alt="Logo" class="w-1/4 max-w-xs">
    </div>

    <!-- Title -->
    <h1 class="text-4xl font-allura text-center mb-3" style="font-weight: 400;">
      Whimsical Gallery
    </h1>

    <!-- Intro text -->
    <p class="text-center text-neutral-700 mb-6">
      Fun and creative cakes and cupcakes for magical celebrations.  Let's dream something up together!
    </p>

    <!-- Gallery grid container -->
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 gallery-grid">
      <!-- JS will populate images here -->
    </div>

  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="" />
    <div id="lightbox-caption"></div>

    <!-- Left arrow -->
    <button id="prev-btn"
            class="absolute left-4 top-1/2 transform -translate-y-1/2 text-white text-3xl p-2 bg-black/50 rounded-full hover:bg-black/70"
            onclick="prevImage(event)">&#10094;</button>

    <!-- Right arrow -->
    <button id="next-btn"
            class="absolute right-4 top-1/2 transform -translate-y-1/2 text-white text-3xl p-2 bg-black/50 rounded-full hover:bg-black/70"
            onclick="nextImage(event)">&#10095;</button>
  </div>

  <script>
    const galleryContainer = document.querySelector('.gallery-grid');

    // ===== Array of images =====
    const images = [
      
      { src: '/whimsical/whim15.jpg', caption: 'Spanish Beach Villa'  },
      { src: '/whimsical/whim03.jpg', caption: 'Fairy Forest'  },
      { src: '/whimsical/whim12.jpg', caption: 'Magical Castle' },
      { src: '/whimsical/whim04.jpg', caption: 'Charming Cottage' },
      
      { src: '/whimsical/whim13.jpg'},
      { src: '/whimsical/whim14.jpg' },
      { src: '/whimsical/whim01.jpg', caption: 'Chocolate Bridge' },
      { src: '/whimsical/whim16.jpg', caption: 'Woodland Stream'  },

      { src: '/whimsical/whim05.jpg' },
      { src: '/whimsical/whim06.jpg', caption: 'Chocolate Easter Baskets' },
      { src: '/whimsical/whim08.jpg', caption: 'Chocolate Easter Baskets' },
      { src: '/whimsical/whim11.jpg' },

      
      // Add more images here
    ];

    // Generate gallery
    images.forEach((img, index) => {
      const imageElement = document.createElement('img');
      imageElement.src = img.src;
      imageElement.className = 'rounded-lg shadow-md cursor-pointer hover:opacity-90';
      imageElement.setAttribute('onclick', `openLightbox('${img.src}', 'img${index}')`);
      if (img.caption) imageElement.dataset.caption = img.caption;
      galleryContainer.appendChild(imageElement);
    });

    // ===== Lightbox logic =====
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxCaption = document.getElementById('lightbox-caption');
    let currentIndex = -1;

    function openLightbox(src, id) {
      currentIndex = images.findIndex(img => img.src === src);
      updateLightbox();
      lightbox.style.display = 'flex';
      history.pushState({ lightboxOpen: true }, '', '#' + id);
    }

    function closeLightbox() {
      lightbox.style.display = 'none';
      lightboxImg.src = '';
      lightboxCaption.textContent = '';
      currentIndex = -1;
      if (location.hash) history.back();
    }

    function showImageByIndex(index) {
      if (index >= 0 && index < images.length) {
        currentIndex = index;
        updateLightbox();
        history.replaceState({ lightboxOpen: true }, '', '#img' + currentIndex);
      }
    }

    function updateLightbox() {
      lightboxImg.src = images[currentIndex].src;
      lightboxCaption.textContent = images[currentIndex].caption || '';
    }

    function prevImage(event) {
      event.stopPropagation();
      showImageByIndex((currentIndex - 1 + images.length) % images.length);
    }

    function nextImage(event) {
      event.stopPropagation();
      showImageByIndex((currentIndex + 1) % images.length);
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (lightbox.style.display === 'flex') {
        if (e.key === 'ArrowRight') nextImage(e);
        else if (e.key === 'ArrowLeft') prevImage(e);
        else if (e.key === 'Escape') closeLightbox();
      }
    });

    // Back button support
    window.addEventListener('popstate', () => {
      if (lightbox.style.display === 'flex') closeLightbox();
    });

    // Auto-open if URL has hash on load
    window.addEventListener('load', () => {
      if (location.hash) {
        const hash = location.hash.substring(1);
        const index = parseInt(hash.replace('img',''));
        if (!isNaN(index) && index >=0 && index < images.length) {
          openLightbox(images[index].src, 'img' + index);
        }
      }
    });
  </script>

</body>
</html>
